services:
  madebylico:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.madebylico.rule=Host(`madebylico.com`) || Host(`www.madebylico.com`)
      - traefik.http.routers.madebylico.entrypoints=websecure
      - traefik.http.routers.madebylico.tls=true
      - traefik.http.routers.madebylico.tls.certresolver=le
      - traefik.http.services.madebylico.loadbalancer.server.port=8080
      - traefik.http.middlewares.madebylico-www.redirectregex.regex=^https?://www\.madebylico\.com/(.*)
      - traefik.http.middlewares.madebylico-www.redirectregex.replacement=https://madebylico.com/$${1}
      - traefik.http.middlewares.madebylico-www.redirectregex.permanent=true
      - traefik.http.middlewares.madebylico-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.madebylico-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.madebylico-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.madebylico-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.madebylico-headers.headers.customFrameOptionsValue=DENY
      - traefik.http.routers.madebylico.middlewares=madebylico-headers,madebylico-www
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: proxy
